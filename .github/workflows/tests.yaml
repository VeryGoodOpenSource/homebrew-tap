name: brew test-bot

# Checks the tap's syntax, and on PRs audits, installs and tests each changed
# formula on every platform vgv_ai ships a binary for.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Not path-filtered: test-bot is a required check, so it has to report on
# every PR.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-bot:
    name: test-bot (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 🍺 Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@2026.11.02.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Cache Homebrew Bundler RubyGems
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # macOS only. On Linux, test-bot builds a bottle, which patches every ELF
      # file in the keg and turns a `dart compile exe` binary back into the
      # bare Dart runtime. The tap publishes no bottles, and install.yaml runs
      # the plain `brew install` and `brew test` users get on Linux.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request' && runner.os == 'macOS'
