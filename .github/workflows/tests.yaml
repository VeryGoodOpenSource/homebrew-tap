name: tests

# Audits, installs and tests every formula on the platforms its binaries are
# built for. update_vgv_ai calls it with the bumped formula before pushing it.

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      formula-artifact:
        description: "An artifact holding formulae to test in place of the committed ones."
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test:
    name: test (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: 🍺 Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@4790763c0a3ba4036f72634dc079c4a7dfcd4878 # 2026.10.19.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⬇️ Download Formula
        if: inputs.formula-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.formula-artifact }}
          path: Formula

      - name: 🔎 Audit, Install and Test
        run: |
          shopt -s nullglob
          formulae=(Formula/*.rb)
          if [ ${#formulae[@]} -eq 0 ]; then
            echo "No formulae yet."
            exit 0
          fi
          brew style "${formulae[@]}"
          for file in "${formulae[@]}"; do
            formula="verygoodopensource/tap/$(basename "$file" .rb)"
            brew audit --strict --online "$formula"
            brew install "$formula"
            brew test "$formula"
          done
